<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Diet & Meal Log Analyst</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
<header class="bg-slate-900 text-white py-5 px-6 shadow">
  <h1 class="text-xl md:text-2xl font-bold">🥗 Smart Diet & Meal Log Analyst</h1>
  <p class="text-slate-400 text-sm">AI-powered macro tracking</p>
</header>

<main class="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-2 gap-6">
  <form id="form" class="bg-white rounded-xl shadow p-5 space-y-4">
    <div>
      <label class="block text-sm font-semibold mb-1">What did you eat today?</label>
      <textarea id="foodLog" rows="6" required maxlength="2000"
        placeholder="e.g. 2 toast and jam for breakfast, dal rice and curd for lunch..."
        class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div><label class="block text-sm font-semibold mb-1">Age</label>
        <input id="age" type="number" min="10" max="100" required class="w-full border rounded-lg p-2"></div>
      <div><label class="block text-sm font-semibold mb-1">Gender</label>
        <select id="gender" class="w-full border rounded-lg p-2">
          <option>Male</option><option>Female</option><option>Other</option></select></div>
      <div><label class="block text-sm font-semibold mb-1">Weight (kg)</label>
        <input id="weightKg" type="number" min="20" max="300" required class="w-full border rounded-lg p-2"></div>
      <div><label class="block text-sm font-semibold mb-1">Height (cm)</label>
        <input id="heightCm" type="number" min="100" max="250" required class="w-full border rounded-lg p-2"></div>
    </div>
    <div>
      <label class="block text-sm font-semibold mb-1">Fitness Goal</label>
      <select id="fitnessGoal" class="w-full border rounded-lg p-2">
        <option>Muscle Building</option><option>Fat Loss</option>
        <option>Endurance</option><option>Maintenance</option></select>
    </div>
    <button id="btn" type="submit"
      class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-400 text-white font-bold py-3 rounded-lg flex justify-center items-center gap-2 transition">
      <svg id="spin" class="hidden animate-spin h-5 w-5" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" class="opacity-25"/>
        <path fill="currentColor" class="opacity-75" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/></svg>
      <span id="btnText">Analyze Metrics</span>
    </button>
    <div id="error" class="hidden bg-red-50 border border-red-300 text-red-700 rounded-lg p-3 text-sm"></div>
  </form>

  <section id="dashboard" class="space-y-4">
    <div id="placeholder" class="bg-white rounded-xl shadow p-8 text-center text-slate-400">
      Your dashboard will appear here after analysis.</div>
    <div id="results" class="hidden space-y-4">
      <div id="cards" class="grid grid-cols-2 gap-3"></div>
      <div class="bg-white rounded-xl shadow p-5">
        <h2 class="font-bold mb-2">📋 Summary</h2>
        <p id="summary" class="text-sm leading-relaxed"></p>
      </div>
      <div class="bg-white rounded-xl shadow p-5">
        <h2 class="font-bold mb-2">🍽️ To Complete Your Target</h2>
        <ol id="recs" class="list-decimal ml-5 space-y-1 text-sm"></ol>
      </div>
    </div>
  </section>
</main>

<script>
const BACKEND_URL = "http://localhost:8080"; // change to https://<your-app>.onrender.com after deploy

const $ = id => document.getElementById(id);
const METRICS = [
  { key: "calories", label: "Calories", unit: "kcal" },
  { key: "proteinGrams", label: "Protein", unit: "g" },
  { key: "carbsGrams", label: "Carbs", unit: "g" },
  { key: "fatsGrams", label: "Fats", unit: "g" }
];

function setLoading(on) {
  $("btn").disabled = on;
  $("spin").classList.toggle("hidden", !on);
  $("btnText").textContent = on ? "AI Coach is analyzing..." : "Analyze Metrics";
}

function showError(msg) {
  $("error").textContent = msg;
  $("error").classList.remove("hidden");
}

function colorFor(pct) {
  if (pct < 50) return { bar: "bg-red-500", text: "text-red-600" };
  if (pct < 90) return { bar: "bg-amber-500", text: "text-amber-600" };
  return { bar: "bg-green-500", text: "text-green-600" };
}

function countUp(el, to) {
  const start = performance.now(), dur = 900;
  (function tick(now) {
    const p = Math.min((now - start) / dur, 1);
    el.textContent = Math.round(to * p);
    if (p < 1) requestAnimationFrame(tick);
  })(start);
}

function render(report) {
  $("cards").innerHTML = "";
  METRICS.forEach(m => {
    const eaten = report.consumed[m.key] || 0;
    const target = report.idealDailyTarget[m.key] || 1;
    const pct = Math.round((eaten / target) * 100);
    const c = colorFor(pct);
    const card = document.createElement("div");
    card.className = "bg-white rounded-xl shadow p-4";
    card.innerHTML = `
      <div class="text-xs uppercase text-slate-500 font-semibold">${m.label}</div>
      <div class="text-2xl font-bold ${c.text}"><span class="val">0</span>
        <span class="text-sm text-slate-400">/ ${target} ${m.unit}</span></div>
      <div class="w-full bg-slate-200 rounded-full h-2.5 mt-2 overflow-hidden">
        <div class="bar h-2.5 rounded-full ${c.bar}" style="width:0%;transition:width 1s ease"></div></div>
      <div class="text-xs mt-1 ${c.text}">${pct}% of target</div>`;
    $("cards").appendChild(card);
    countUp(card.querySelector(".val"), eaten);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      card.querySelector(".bar").style.width = Math.min(pct, 100) + "%";
    }));
  });
  $("summary").textContent = report.deficitOrSurplusStatus;
  $("recs").innerHTML = "";
  (report.recommendationsToCompleteTarget || []).forEach(r => {
    const li = document.createElement("li");
    li.textContent = r;
    $("recs").appendChild(li);
  });
  $("placeholder").classList.add("hidden");
  $("results").classList.remove("hidden");
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  $("error").classList.add("hidden");
  setLoading(true);
  const payload = {
    foodLog: $("foodLog").value.trim(),
    age: parseInt($("age").value, 10),
    gender: $("gender").value,
    weightKg: parseInt($("weightKg").value, 10),
    heightCm: parseInt($("heightCm").value, 10),
    fitnessGoal: $("fitnessGoal").value
  };
  try {
    const res = await fetch(BACKEND_URL + "/api/diet/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || "Server error (" + res.status + ")");
    render(data);
  } catch (err) {
    showError(err instanceof TypeError
      ? "Cannot reach server. If it's on Render free tier, wait ~50s for wake-up and retry."
      : err.message);
  } finally {
    setLoading(false);
  }
});
</script>
</body>
</html>
